<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz día de las flores amarillas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #0b0b0b;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        .tarjeta {
            text-align: center;
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #141414;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        h1 {
            color: #f3d250;
            font-size: 1.8rem;
            font-style: italic;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(243, 210, 80, 0.3);
            line-height: 1.3;
        }

        .ramo-container {
            width: 100%;
            height: 320px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 2px solid rgba(243, 210, 80, 0.3);
            background: #000;
        }

        .ramo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .ramo-container img:hover {
            transform: scale(1.05);
        }

        .subtitulo {
            font-size: 1.1rem;
            color: #ddd;
            margin-bottom: 1.5rem; 
            font-style: italic;
        }

        .firma {
            font-size: 1.1rem;
            color: #f3d250;
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        <h1>¡Flores Amarillas para ti! 💛</h1>
        
        <div class="ramo-container">
            <img src="flor.png.jpe" alt="Gatito con flores amarillas">
        </div>

        <p class="subtitulo">¡Hoy no vas a hacer espectador@! ✨</p>


        <p class="firma">Con cariño para ti 🌻</p>
    </div>

</body>
</html>
